<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=720, user-scalable=no">
    <title>Visitor Log</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #0052cc;
            --bg: #f4f7f9;
            --text: #172b4d;
        }

        body {
            width: 720px;
            height: 1280px;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents bounce scrolling */
        }

        .container {
            width: 620px; /* Provides 50px gutter on each side */
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 48px;
            text-align: center;
            margin-bottom: 60px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #444;
        }

        input {
            width: 100%;
            height: 90px; /* Massive touch target for 720p */
            font-size: 32px;
            padding: 0 25px;
            border: 3px solid #dfe1e6;
            border-radius: 12px;
            background: #fafbfc;
            outline: none;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .submit-btn {
            width: 100%;
            height: 100px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 36px;
            font-weight: 700;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 82, 204, 0.2);
        }

        .submit-btn:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        /* Landscape Rotation Handling */
        @media (orientation: landscape) {
            body {
                width: 1280px;
                height: 720px;
            }
            .container {
                width: 800px;
                padding: 30px 40px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            h1 { grid-column: span 2; margin-bottom: 20px; }
            .submit-btn { grid-column: span 2; margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Visitor Sign-In</h1>
    <form id="visitorForm">
        <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" id="fname" required placeholder="Enter first name">
        </div>
        <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" required placeholder="Enter last name">
        </div>
        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" required placeholder="Organization name">
        </div>
        <button type="submit" class="submit-btn">Check In</button>
    </form>
</div>

<script>
    document.getElementById('visitorForm').onsubmit = function(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('fname').value + ' ' + document.getElementById('lname').value,
            company: document.getElementById('company').value,
            time: new Date().toLocaleTimeString()
        };
        
        console.log('New Visitor:', data);
        alert('Welcome, ' + data.name + '!');
        this.reset();
    };
</script>

</body>
</html>
