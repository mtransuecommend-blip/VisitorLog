<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitor Log</title>
    <style>
        /* Force high contrast and prevent text-size-adjust issues */
        html { -webkit-text-size-adjust: 100%; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5 !important; /* Light Grey Background */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff !important; /* White Card */
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #ddd;
        }

        /* Explicitly styling the Title */
        h1 {
            color: #1a1a1a !important; /* Dark Black/Grey */
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            display: block !important;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        /* Explicitly styling the Labels */
        label {
            display: block !important;
            color: #333333 !important; /* Solid Dark Grey */
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            text-align: left;
        }

        input {
            width: 100%;
            height: 55px;
            font-size: 20px;
            padding: 10px;
            border: 2px solid #333; /* Darker border for visibility */
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff !important;
            color: #000 !important;
        }

        button {
            width: 100%;
            height: 65px;
            background-color: #0052cc;
            color: #ffffff !important;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Auto-scale for Portrait vs Landscape */
        @media (orientation: landscape) {
            body { align-items: flex-start; padding-top: 20px; }
            .container { max-width: 600px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Visitor Sign-In</h1>
        
        <form id="logForm">
            <div class="input-wrapper">
                <label for="f">First Name</label>
                <input type="text" id="f" required>
            </div>

            <div class="input-wrapper">
                <label for="l">Last Name</label>
                <input type="text" id="l" required>
            </div>

            <div class="input-wrapper">
                <label for="c">Company Name</label>
                <input type="text" id="c" required>
            </div>

            <button type="submit">Complete Sign-In</button>
        </form>
    </div>

    <script>
        document.getElementById('logForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Success! Thank you for signing in.');
            this.reset();
        };
    </script>

</body>
</html>
