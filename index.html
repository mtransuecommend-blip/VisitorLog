<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitor Log</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --text: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }

        .field { margin-bottom: 1.5rem; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 16px; /* Touch friendly size */
            font-size: 1.1rem; /* Prevents auto-zoom on mobile */
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; transform: scale(0.99); }

        /* Auto-scale for Landscape */
        @media (orientation: landscape) and (max-height: 500px) {
            body { padding: 10px; }
            .card { padding: 1rem; }
            .field { margin-bottom: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Visitor Sign-In</h1>
    <form id="visitorForm">
        <div class="field">
            <label for="fname">First Name</label>
            <input type="text" id="fname" required placeholder="John">
        </div>
        <div class="field">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" required placeholder="Doe">
        </div>
        <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" required placeholder="Acme Corp">
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>

<script>
    document.getElementById('visitorForm').onsubmit = function(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('fname').value + ' ' + document.getElementById('lname').value,
            company: document.getElementById('company').value,
            time: new Date().toLocaleTimeString()
        };
        alert('Welcome, ' + data.name + ' from ' + data.company + '!');
        this.reset();
    };
</script>

</body>
</html>
