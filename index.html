<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Visitor Sign-In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #f0f2f5;
            --brand-blue: #0052cc;
            --input-bg: #ffffff;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents stray scrolling on kiosks */
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
        }

        /* Main Wrapper - Force full screen */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            padding: 20px;
        }

        .visitor-card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #1a1a1a;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 1.1rem;
        }

        input {
            width: 100%;
            height: 60px; /* Large touch target */
            padding: 0 15px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none; /* Removes iOS inner shadows */
        }

        input:focus {
            border-color: var(--brand-blue);
        }

        .submit-btn {
            width: 100%;
            height: 65px;
            background-color: var(--brand-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 82, 204, 0.2);
        }

        .submit-btn:active {
            transform: translateY(2px);
            filter: brightness(0.9);
        }

        /* Portrait Specific scaling */
        @media (orientation: portrait) {
            .visitor-card {
                max-width: 95%;
                padding: 2rem 1.5rem;
            }
            h1 { font-size: 1.7rem; }
        }

        /* Landscape Specific adjustments for short screens */
        @media (orientation: landscape) and (max-height: 600px) {
            .wrapper { align-items: flex-start; overflow-y: auto; }
            .visitor-card { margin-top: 10px; padding: 1.5rem; }
            h1 { margin-bottom: 1rem; font-size: 1.5rem; }
            .input-group { margin-bottom: 1rem; }
            input { height: 50px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="visitor-card">
        <h1>Welcome</h1>
        <form id="vLog">
            <div class="input-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="comp">Company</label>
                <input type="text" id="comp" required autocomplete="off">
            </div>
            <button type="submit" class="submit-btn">Check In</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('vLog').onsubmit = function(e) {
        e.preventDefault();
        const f = document.getElementById('fname').value;
        const l = document.getElementById('lname').value;
        const c = document.getElementById('comp').value;
        
        // Log to console for debugging
        console.log(`Entry: ${f} ${l}, ${c}`);
        
        alert(`Welcome, ${f}! You have been signed in.`);
        this.reset();
    };
</script>

</body>
</html>
